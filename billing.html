<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billing · FloatTask</title>
<meta name="description" content="FloatTask Pro checkout result.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  /* FloatTask's own palette (src/app/app.css) */
  --bg: oklch(0.984 0.004 270);
  --surface: oklch(1 0 0);
  --raised: oklch(0.956 0.005 272);
  --line: oklch(0.9 0.008 272);
  --ink: oklch(0.245 0.013 275);
  --ink-2: oklch(0.4 0.018 276);
  --muted: oklch(0.505 0.02 276);
  --accent: oklch(0.528 0.196 270);
  --accent-ink: oklch(0.5 0.195 271);
  --accent-soft: oklch(0.934 0.024 272);
  --on-accent: oklch(1 0 0);
  --lilac: oklch(0.62 0.19 298);
  --ok: oklch(0.55 0.145 150);
  --danger: oklch(0.577 0.205 27);
  --wall-a: oklch(0.86 0.035 262);
  --wall-b: oklch(0.93 0.02 300);
  --menubar: oklch(1 0 0 / .62);
  --shadow: 0 24px 60px oklch(0.42 0.06 270 / .22), 0 2px 6px oklch(0.42 0.06 270 / .08);
  --show-l: block; --show-d: none;

  --f-display: 'Bricolage Grotesque', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --f-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --f-mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --wrap: 1120px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.173 0.004 270); --surface: oklch(0.216 0.008 275); --raised: oklch(0.235 0.005 275);
    --line: oklch(0.287 0.008 275); --ink: oklch(0.93 0.006 270); --ink-2: oklch(0.8 0.01 272); --muted: oklch(0.64 0.014 276);
    --accent: oklch(0.686 0.153 271); --accent-ink: oklch(0.78 0.09 271); --accent-soft: oklch(0.29 0.029 272); --on-accent: oklch(0.16 0.027 265);
    --lilac: oklch(0.692 0.16 298); --ok: oklch(0.733 0.135 153); --danger: oklch(0.682 0.16 23);
    --wall-a: oklch(0.3 0.05 268); --wall-b: oklch(0.24 0.04 300); --menubar: oklch(0.2 0.01 275 / .7);
    --shadow: 0 24px 60px oklch(0 0 0 / .45), 0 2px 6px oklch(0 0 0 / .3);
    --show-l: none; --show-d: block; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.173 0.004 270); --surface: oklch(0.216 0.008 275); --raised: oklch(0.235 0.005 275);
  --line: oklch(0.287 0.008 275); --ink: oklch(0.93 0.006 270); --ink-2: oklch(0.8 0.01 272); --muted: oklch(0.64 0.014 276);
  --accent: oklch(0.686 0.153 271); --accent-ink: oklch(0.78 0.09 271); --accent-soft: oklch(0.29 0.029 272); --on-accent: oklch(0.16 0.027 265);
  --lilac: oklch(0.692 0.16 298); --ok: oklch(0.733 0.135 153); --danger: oklch(0.682 0.16 23);
  --wall-a: oklch(0.3 0.05 268); --wall-b: oklch(0.24 0.04 300); --menubar: oklch(0.2 0.01 275 / .7);
  --shadow: 0 24px 60px oklch(0 0 0 / .45), 0 2px 6px oklch(0 0 0 / .3);
  --show-l: none; --show-d: block; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: var(--wrap); margin-inline: auto; padding-inline: clamp(16px, 4vw, 32px); }
a { color: var(--accent-ink); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
p { margin: 0; }
kbd, .mono { font-family: var(--f-mono); font-size: .86em; }
kbd { padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); white-space: nowrap; }
.shot-l { display: var(--show-l); } .shot-d { display: var(--show-d); }
img { max-width: 100%; height: auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 24px; padding-block: 20px; }
.logo { display: inline-flex; align-items: center; gap: 9px; font: 650 19px/1 var(--f-display); color: var(--ink); text-decoration: none; letter-spacing: -.01em; }
.logo svg { color: var(--accent); }
.top nav { margin-left: auto; display: flex; align-items: center; gap: 22px; font-size: 15px; }
.top nav a { color: var(--ink-2); text-decoration: none; }
.top nav a:hover { color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 8px; font: 600 15px/1 var(--f-body); text-decoration: none; border: 1px solid transparent; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.quiet:hover { background: var(--raised); }
.btn.small { height: 36px; padding: 0 14px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; }

footer { padding-block: 48px 120px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; color: var(--muted); font-size: 14px; }
footer .logo { font-size: 16px; }
footer .right { margin-left: auto; }

[hidden] { display: none !important; }
/* ---------- billing ---------- */
.billing { padding-block: clamp(48px, 10vw, 120px) 0; display: grid; justify-items: center; text-align: center; }
.billing .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: clamp(28px, 5vw, 48px); max-width: 520px; width: 100%; display: grid; gap: 14px; justify-items: center; }
.billing .tick { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.billing h1 { font-size: clamp(1.8rem, 4.4vw, 2.4rem); line-height: 1.1; font-weight: 750; letter-spacing: -.025em; }
.billing p { color: var(--ink-2); max-width: 40ch; }
.billing .hint { font-size: 14px; color: var(--muted); }
@media (max-width: 560px) {
  .top nav a:not(.btn) { display: none; }
  footer .right { margin-left: 0; }
}
</style>
<meta name="robots" content="noindex">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="11" rx="5.5"/><path d="M9 8.5l2 2 4-4M5 18h14M8 21.5h8"/></g></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/" aria-label="FloatTask home"><svg width="24" height="24"><use href="#mark"/></svg>FloatTask</a>
    <nav aria-label="Site">
      <a href="/#how">How it works</a>
      <a href="/#features">Features</a>
      <a href="/contact.html">Contact</a>
      <a class="btn primary small" href="/#download"><svg><use href="#down"/></svg>Download</a>
    </nav>
  </header>

  <main class="billing">
    <div class="card">
      <span class="tick" id="tick"><svg width="24" height="24"><use href="#check"/></svg></span>
      <h1 id="h">Billing updated</h1>
      <p id="p">Head back to FloatTask. You can close this tab.</p>
      <p class="hint" id="hint">Questions about billing? <a href="/contact.html">Contact us</a>.</p>
    </div>
  </main>

  <footer>
    <a class="logo" href="/"><svg width="20" height="20"><use href="#mark"/></svg>FloatTask</a>
    <span>© 2026 FloatTask</span>
    <a href="/contact.html">Contact</a>
    <span class="right">floattask.com</span>
  </footer>
</div>

<script>
(() => {
  const r = new URLSearchParams(location.search).get('result');
  const h = document.getElementById('h'), p = document.getElementById('p');
  if (r === 'success') {
    h.textContent = "You're on FloatTask Pro";
    p.textContent = 'Switch back to FloatTask — your plan updates on its own within a few seconds. If you started a free trial, you won\'t be charged until it ends. You can close this tab.';
  } else if (r === 'cancel') {
    document.getElementById('tick').hidden = true;
    h.textContent = 'No charge made';
    p.textContent = 'Checkout was cancelled. You can go Pro any time from Settings › FloatTask AI.';
  } else if (r === 'portal') {
    h.textContent = 'Billing updated';
    p.textContent = 'Any changes you made are saved. Head back to FloatTask — you can close this tab.';
  }
})();
</script>
</body>
</html>
