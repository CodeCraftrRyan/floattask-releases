<style>
/* this page */
.billing { padding-block: clamp(48px, 10vw, 120px) 0; display: grid; justify-items: center; text-align: center; }
.billing .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: clamp(28px, 5vw, 48px); max-width: 520px; width: 100%; display: grid; gap: 14px; justify-items: center; }
.billing .tick { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in oklab, var(--a-myday) 24%, var(--surface)); color: var(--gold-text); }
.billing h1 { font-size: clamp(1.8rem, 4.4vw, 2.4rem); line-height: 1.1; font-weight: 750; letter-spacing: -.025em; }
.billing p { color: var(--ink-2); max-width: 40ch; }
.billing .hint { font-size: 14px; color: var(--muted); }
@media (max-width: 560px) {
  .top nav a:not(.btn) { display: none; }
  footer .right { margin-left: 0; }
}
</style>
<meta name="robots" content="noindex">
<script src="/consent.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="11" rx="5.5"/><path d="M9 8.5l2 2 4-4M5 18h14M8 21.5h8"/></g></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/" aria-label="FloatTask home"><svg width="26" height="26"><use href="#mark"/></svg>FloatTask</a>
    <nav aria-label="Site">
      <a href="/#how">How it works</a>
      <a href="/#features">Features</a>
      <a href="/#uses">Work, school &amp; life</a>
      <a href="/#pricing">Pricing</a>
      <a href="/contact.html">Contact</a>
      <a class="btn primary small launch-only" href="/#download"><svg><use href="#down"/></svg>Download</a>
      <a class="btn primary small prelaunch-only" href="/contact.html">Get early access</a>
    </nav>
  </header>

  <main class="billing">
    <div class="card">
      <span class="tick" id="tick"><svg width="24" height="24"><use href="#check"/></svg></span>
      <h1 id="h">Billing updated</h1>
      <p id="p">Head back to FloatTask. You can close this tab.</p>
      <p class="hint" id="hint">Questions about billing? <a href="/contact.html">Contact us</a>.</p>
    </div>
  </main>

  <footer>
    <a class="logo" href="/"><svg width="22" height="22"><use href="#mark"/></svg>FloatTask</a>
    <span>© 2026 FloatTask</span>
    <a href="/privacy.html">Privacy</a>
    <a href="/terms.html">Terms</a>
    <a href="/contact.html">Contact</a>
    <a href="#" data-cookie-settings>Cookie settings</a>
    <span class="right">floattask.com</span>
  </footer>
</div>

<script>
(() => {
  const r = new URLSearchParams(location.search).get('result');
  const h = document.getElementById('h'), p = document.getElementById('p');
  if (r === 'success') {
    h.textContent = "You're on FloatTask Pro";
    p.textContent = 'Switch back to FloatTask — your plan updates on its own within a few seconds. If you started a free trial, you won\'t be charged until it ends. You can close this tab.';
  } else if (r === 'cancel') {
    document.getElementById('tick').hidden = true;
    h.textContent = 'No charge made';
    p.textContent = 'Checkout was cancelled. You can go Pro any time from Settings › Assist.';
  } else if (r === 'portal') {
    h.textContent = 'Billing updated';
    p.textContent = 'Any changes you made are saved. Head back to FloatTask — you can close this tab.';
  }
})();
</script>
</body>
</html>
